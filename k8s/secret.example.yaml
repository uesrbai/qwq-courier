# AUTH_SECRET 密钥（请勿把真实值提交到 git）。两种创建方式：
#
# 方式一（推荐，命令行直接生成随机值，不落盘）：
#   kubectl create secret generic qwq-courier-secrets \
#     --from-literal=AUTH_SECRET="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
#
# 方式二：复制本文件为 secret.yaml，填入自己的值后 kubectl apply -f secret.yaml
#   （stringData 用明文，k8s 会自动编码；用完记得别把 secret.yaml 入库）
apiVersion: v1
kind: Secret
metadata:
  name: qwq-courier-secrets
  labels:
    app: qwq-courier
type: Opaque
stringData:
  AUTH_SECRET: "换成随机 64 位十六进制串"
  # 若改用 Postgres，可在此加 DATABASE_URL，并把 deployment 里的 DATABASE_URL 改为 secretKeyRef：
  # DATABASE_URL: "postgresql://user:pass@host:5432/db"
